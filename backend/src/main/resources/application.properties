spring.application.name=jobfinder-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/jobfinder?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

job.api.base-url=${JOB_API_BASE_URL:https://himalayas.app}

jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-please-123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.jackson.serialization.write-dates-as-timestamps=false
